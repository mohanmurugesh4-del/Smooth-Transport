[platformio]
src_dir = firmware/src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bogde/HX711 @ ^0.7.5
  adafruit/Adafruit MPU6050 @ ^2.2.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  madhephaestus/ESP32Servo @ ^3.0.5
  bblanchon/ArduinoJson @ ^7.3.0
